<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Types in Javascript</title>
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Primitive Type in Javascript</h1>
      </header>
      <ul>
        <li>Number</li>
        <li>Boolean</li>
        <li>String</li>
        <li>Undefined</li>
        <li>Null</li>
        <li>Symbol("Just me")</li>
      </ul>
      <header>
        <h1>Non Primitive Type in Javascript</h1>
      </header>
      <ul>
        <li>Object {}</li>
        <li>Arrays</li>
        <li>Function</li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
